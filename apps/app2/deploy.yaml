apiVersion: apps/v1
kind: Deployment
metadata:
  name: nginx
spec:
  replicas: 1
  selector:
    matchLabels:
      app: nginx
  template:
    metadata:
      labels:
        app: nginx
    spec:
      containers:
        - name: nginx
          image: nginx:stable
          ports:
            - containerPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: app2-nginx
spec:
  selector:
    app: nginx
  ports:
    - port: 80
      targetPort: 80
  type: ClusterIP
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: app2
  namespace: app2
spec:
  ingressClassName: traefik
  tls:
    - hosts:
        - app2.tomb.local
  rules:
    - host: app2.tomb.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: app2-nginx
                port:
                  number: 80
