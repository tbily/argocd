    start;\n    display: grid;\n    gap: 2px;\n  }\n  @media (max-width: 860px) {\n
    \   /* stacked: no main card to match, so grow with content up to a sane cap */\n
    \   .side ol { flex: 0 1 auto; max-height: 340px; }\n  }\n  .side li {\n    display:
    flex;\n    justify-content: space-between;\n    gap: 10px;\n    padding: 7px 2px;\n
    \   font-size: 14px;\n    font-variant-numeric: tabular-nums;\n    border-bottom:
    1px solid var(--line);\n  }\n  .side li:last-child { border-bottom: 0; }\n  .side
    li .idx { color: var(--muted); font-size: 12px; }\n  .side .empty { font-size:
    13px; color: var(--muted); font-style: italic; }\n\n  [hidden] { display: none
    !important; }\n</style>\n</head>\n<body>\n\n<!-- Screen 1: asked once, then hidden
    until Reset -->\n<div class=\"card setup\" id=\"setupScreen\" hidden>\n  <h1>Nová
    hypotéka</h1>\n  <p>Zadej celkovou částku, kterou je potřeba splatit. Zadáváš
    ji jen jednou.</p>\n  <form id=\"setupForm\" autocomplete=\"off\">\n    <div class=\"big-input\">\n
    \     <div class=\"field\">\n        <input id=\"total\" type=\"text\" inputmode=\"numeric\"
    placeholder=\"4 500 000\" autofocus>\n        <span class=\"cur\">Kč</span>\n
    \     </div>\n    </div>\n    <button type=\"submit\" class=\"lg\" style=\"width:100%\">Začít
    splácet</button>\n  </form>\n</div>\n\n<!-- Screen 2: tracking -->\n<div class=\"layout\"
    id=\"trackScreen\" hidden>\n  <div class=\"card\">\n    <div class=\"head\">\n
    \     <div>\n        <h1>Kolik zbývá doplatit</h1>\n        <div class=\"total\">z
    celkových <b id=\"totalLabel\">0 Kč</b></div>\n      </div>\n    </div>\n\n    <form
    class=\"pay\" id=\"payForm\" autocomplete=\"off\">\n      <div class=\"pay-label\">Nová
    splátka</div>\n      <div class=\"big-input\">\n        <div class=\"field\">\n
    \         <input id=\"inc\" type=\"text\" inputmode=\"numeric\" placeholder=\"18
    000\">\n          <span class=\"cur\">Kč</span>\n        </div>\n        <button
    type=\"submit\" class=\"lg\">Přidat</button>\n      </div>\n      <div class=\"quick\"
    id=\"quick\"></div>\n    </form>\n\n    <div class=\"remaining\">\n      <span
    id=\"remaining\">0 Kč</span>\n      <small>zbývá k doplacení</small>\n    </div>\n\n
    \   <div class=\"bar\"><div class=\"fill\" id=\"fill\"></div></div>\n    <div
    class=\"amounts\">\n      <span id=\"paidLabel\">Zaplaceno 0 Kč</span>\n      <span
    id=\"pctLabel\">0 %</span>\n    </div>\n\n    <div class=\"caption\" id=\"caption\"></div>\n\n
    \   <div class=\"actions\">\n      <button type=\"button\" class=\"ghost\" id=\"undo\">Vrátit
    poslední</button>\n      <button type=\"button\" class=\"ghost\" id=\"reset\">Reset</button>\n
    \   </div>\n  </div>\n\n  <aside class=\"card side\">\n    <h2>Historie splátek
    <span id=\"count\">0</span></h2>\n    <div class=\"sum\" id=\"sum\">Zaplaceno
    0 Kč</div>\n    <ol id=\"list\"></ol>\n  </aside>\n</div>\n\n<script>\nconst KEY
    = 'mortgage-progress-v1';\nlet state = { total: 0, payments: [] };\n\nconst $
    = id => document.getElementById(id);\nconst czk = n => new Intl.NumberFormat('cs-CZ',
    {\n  style: 'currency', currency: 'CZK', maximumFractionDigits: 0\n}).format(n);\n\n//
    \"4500000\" -> \"4 500 000\"; digits only, groups of three\nconst groupDigits
    = digits => digits.replace(/\\B(?=(\\d{3})+$)/g, ' ');\nconst digitsOf = str =>
    String(str).replace(/\\D/g, '');\nconst numOf = str => Number(digitsOf(str) ||
    0);\n\n// Reformat in place while keeping the caret at the same digit position.\nfunction
    formatInput(el) {\n  const before = el.value;\n  const caret = el.selectionStart
    ?? before.length;\n  const digitsBeforeCaret = digitsOf(before.slice(0, caret)).length;\n\n
    \ el.value = groupDigits(digitsOf(before));\n\n  let pos = 0, seen = 0;\n  while
    (pos < el.value.length && seen < digitsBeforeCaret) {\n    if (/\\d/.test(el.value[pos]))
    seen++;\n    pos++;\n  }\n  el.setSelectionRange(pos, pos);\n}\n\n// dd. mm. yyyy
    — zero-padded, built by hand so the padding is guaranteed\nfunction payDate(p)
    {\n  const d = new Date(p.date);\n  const pad = n => String(n).padStart(2, '0');\n
    \ return `${pad(d.getDate())}. ${pad(d.getMonth() + 1)}. ${d.getFullYear()}`;\n}\n\nfunction
    load() {\n  try {\n    const s = JSON.parse(localStorage.getItem(KEY));\n    if
    (s && typeof s.total === 'number' && Array.isArray(s.payments)) {\n      state
    = s;\n      // migrate bare numbers from before payments carried a date\n      state.payments
    = state.payments.map(p =>\n        typeof p === 'number' ? { amount: p, date:
    null } : p);\n    }\n  } catch (e) { /* ignore corrupt storage */ }\n}\nconst
    save = () => localStorage.setItem(KEY, JSON.stringify(state));\n\nfunction monthsCaption(remaining,
    avg) {\n  if (remaining <= 0) return 'Splaceno! \U0001F389';\n  if (!avg) return
    'Přidej první splátku a spočítám, jak dlouho to bude trvat.';\n\n  const months
    = Math.ceil(remaining / avg);\n  const years = Math.floor(months / 12);\n  const
    rest = months % 12;\n  const when = new Date();\n  when.setMonth(when.getMonth()
    + months);\n\n  let dur;\n  if (years === 0) dur = `${months} ${months === 1 ?
    'měsíc' : months < 5 ? 'měsíce' : 'měsíců'}`;\n  else dur = `${years} ${years
    === 1 ? 'rok' : years < 5 ? 'roky' : 'let'}` +\n             (rest ? ` a ${rest}
    ${rest === 1 ? 'měsíc' : rest < 5 ? 'měsíce' : 'měsíců'}` : '');\n\n  const date
    = when.toLocaleDateString('cs-CZ', { month: 'long', year: 'numeric' });\n  return
    `Při průměrné splátce ${czk(avg)} / měsíc zbývá ${dur} (${months} splátek) — doplaceno
    cca ${date}.`;\n}\n\n// One-tap repeats of the amounts already used, most recent
    first.\nfunction renderQuick() {\n  const recent = [...new Set([...state.payments].reverse().map(p
    => p.amount))].slice(0, 3);\n  $('quick').innerHTML = recent\n    .map(v => `<button
    type=\"button\" class=\"chip\" data-amount=\"${v}\">+ ${czk(v)}</button>`)\n    .join('');\n}\n\nfunction
    render() {\n  const setup = state.total <= 0;\n  $('setupScreen').hidden = !setup;\n
    \ $('trackScreen').hidden = setup;\n  if (setup) return;\n\n  const paid = state.payments.reduce((a,
    p) => a + p.amount, 0);\n  const remaining = Math.max(0, state.total - paid);\n
    \ const pct = Math.min(100, (paid / state.total) * 100);\n  const avg = state.payments.length
    ? paid / state.payments.length : 0;\n\n  $('totalLabel').textContent = czk(state.total);\n
    \ $('fill').style.width = pct + '%';\n  $('paidLabel').textContent = 'Zaplaceno
    ' + czk(paid);\n  $('pctLabel').textContent = pct.toFixed(1) + ' %';\n  $('remaining').textContent
    = czk(remaining);\n  $('caption').textContent = monthsCaption(remaining, avg);\n
    \ $('count').textContent = state.payments.length;\n  $('sum').textContent = 'Zaplaceno
    ' + czk(paid);\n  $('list').innerHTML = state.payments.length\n    ? state.payments.map(p
    =>\n        `<li><span class=\"idx\">${p.date ? payDate(p) : '—'}</span><span>${czk(p.amount)}</span></li>`).join('')\n
    \   : '<li class=\"empty\">Zatím žádné splátky.</li>';\n  renderQuick();\n}\n\nfunction
    addPayment(v) {\n  if (!(v > 0)) return;\n  state.payments.push({ amount: v, date:
    new Date().toISOString() });\n  save(); render();\n}\n\n$('total').addEventListener('input',
    e => formatInput(e.target));\n$('inc').addEventListener('input', e => formatInput(e.target));\n\n$('setupForm').addEventListener('submit',
    e => {\n  e.preventDefault();\n  const v = numOf($('total').value);\n  if (!(v
    > 0)) { $('total').focus(); return; }\n  state.total = v;\n  save(); render();\n
    \ $('inc').focus();\n});\n\n$('payForm').addEventListener('submit', e => {\n  e.preventDefault();\n
    \ addPayment(numOf($('inc').value));\n  $('inc').value = '';\n  $('inc').focus();\n});\n\n$('quick').addEventListener('click',
    e => {\n  const btn = e.target.closest('button[data-amount]');\n  if (btn) addPayment(Number(btn.dataset.amount));\n});\n\n$('undo').addEventListener('click',
    () => {\n  state.payments.pop(); save(); render();\n});\n\n$('reset').addEventListener('click',
    () => {\n  if (!confirm('Smazat celkovou částku i všechny splátky?')) return;\n
    \ state = { total: 0, payments: [] };\n  save();\n  $('total').value = '';\n  render();\n
    \ $('total').focus();\n});\n\nload(); render();\n</script>\n</body>\n</html>\n"
kind: ConfigMap
metadata:
  name: mortgage-content
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mortgage
  labels:
    app: mortgage
spec:
  replicas: 2
  selector:
    matchLabels:
      app: mortgage
  template:
    metadata:
      labels:
        app: mortgage
    spec:
      containers:
        - name: nginx
          image: nginx:1.27-alpine
          ports:
            - containerPort: 80
              name: http
          volumeMounts:
            - name: content
              mountPath: /usr/share/nginx/html
              readOnly: true
            # nginx needs these writable; the root filesystem is read-only below.
            - name: cache
              mountPath: /var/cache/nginx
            - name: run
              mountPath: /var/run
          resources:
            requests:
              cpu: 25m
              memory: 32Mi
            limits:
              cpu: 200m
              memory: 128Mi
          securityContext:
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
              # NET_BIND_SERVICE: bind port 80. CHOWN/SETUID/SETGID: the nginx
              # entrypoint chowns /var/cache/nginx and drops to the nginx user.
              add: ["NET_BIND_SERVICE", "CHOWN", "SETUID", "SETGID"]
          readinessProbe:
            httpGet:
              path: /index.html
              port: http
            initialDelaySeconds: 3
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /index.html
              port: http
            initialDelaySeconds: 10
            periodSeconds: 20
      volumes:
        - name: content
          configMap:
            name: mortgage-content
        - name: cache
          emptyDir: {}
        - name: run
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: mortgage
  labels:
    app: mortgage
spec:
  type: ClusterIP
  selector:
    app: mortgage
  ports:
    - name: http
      port: 80
      targetPort: http
---
# Server certificate issued by the in-cluster tomb-local-ca ClusterIssuer.
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: mortgage-tls
spec:
  secretName: mortgage-tls
  dnsNames:
    - mortgage.tomb.local
  issuerRef:
    name: tomb-local-ca
    kind: ClusterIssuer
    group: cert-manager.io
---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: redirect-https
spec:
  redirectScheme:
    scheme: https
    permanent: true
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: mortgage
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: web,websecure
    traefik.ingress.kubernetes.io/router.middlewares: mortgage-redirect-https@kubernetescrd
spec:
  ingressClassName: traefik
  tls:
    - hosts:
        - mortgage.tomb.local
      secretName: mortgage-tls
  rules:
    - host: mortgage.tomb.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: mortgage
                port:
                  name: http
