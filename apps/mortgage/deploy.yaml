    10px;\n    text-align: center;\n    font-size: 14px;\n    color: var(--muted);\n
    \ }\n  .actions { display: flex; gap: 8px; margin-top: 20px; }\n\n  button {\n
    \   padding: 11px 16px;\n    border-radius: 10px;\n    border: 1px solid transparent;\n
    \   background: var(--accent);\n    color: #08111c;\n    font-size: 15px;\n    font-weight:
    600;\n    cursor: pointer;\n    white-space: nowrap;\n  }\n  button:hover { filter:
    brightness(1.08); }\n  button.lg { padding: 14px 26px; font-size: 17px; border-radius:
